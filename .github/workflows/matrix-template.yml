name: Build repository against supported released versions

on:
  workflow_call:
    inputs:
      repository:
        type: string
        required: true
      override-input:
        type: string
        required: true
    secrets:
      CELLER_CACHE:
      CELLER_ENDPOINT:
      CELLER_TOKEN:

jobs:
  discover:
    runs-on: ubuntu-latest

    outputs:
      packages: ${{ steps.discover.outputs.packages }}

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          allow-unsafe-pr-checkout: ${{ inputs.allow-unsafe-pr-checkout }}

      - uses: NixOS/nix-installer-action@v1
        with:
          extra-conf: |
            experimental-features = nix-command flakes

      - name: Get all versions
        id: discover
        run: |
          PACKAGES=$(nix eval --json ${{ inputs.repository }}#checks.x86_64-linux --override-input ${{ inputs.override-input }} . --apply builtins.attrNames)
          echo "packages=${PACKAGES}" >> "$GITHUB_OUTPUT"

  matrix:
    needs: discover
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.discover.outputs.packages) }}

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          allow-unsafe-pr-checkout: true

      - uses: NixOS/nix-installer-action@v1
        with:
          extra-conf: |
            experimental-features = nix-command flakes

      - name: Check whether the build is in the cache
        id: cache
        run: |
          HASH="$(nix eval --raw ${{ inputs.repository }}#checks.x86_64-linux.${{ matrix.package }} --override-input ${{ inputs.override-input }} .)"
          HTTP_STATUS="$(curl ${{ secrets.CELLER_ENDPOINT }}/${{ secrets.CELLER_CACHE }}/${HASH:11:32}.narinfo -H 'Authorization: Bearer ${{ secrets.CELLER_TOKEN }}' -o /dev/null -s -w '%{http_code}')"
          echo "HTTP code status for ${HASH}: ${HTTP_STATUS}"
          echo "status=${HTTP_STATUS}" >> "$GITHUB_OUTPUT"

      # NOTE: This step is required until 'celler' is available in nixpkgs
      # NOTE: This step is required until 'celler' is not automatically downloaded from ryanccn/attic-action
      - name: Download celler
        if: ${{ steps.cache.outputs.status != '200' }}
        run: |
          curl ${{ secrets.CELLER_ENDPOINT }}/celler -o attic
          install -m 755 attic /usr/local/bin/

      - uses: ryanccn/attic-action@v0
        if: ${{ steps.cache.outputs.status != '200' }}
        with:
          endpoint: ${{ secrets.CELLER_ENDPOINT }}
          cache: ${{ secrets.CELLER_CACHE }}
          token: ${{ secrets.CELLER_TOKEN }}

      - name: Build specific version
        if: ${{ steps.cache.outputs.status != '200' }}
        run: |
          nix build ${{ inputs.repository }}#checks.x86_64-linux.${{ matrix.package }} --override-input ${{ inputs.override-input }} . --print-build-logs
